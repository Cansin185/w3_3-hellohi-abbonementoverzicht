<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Abonnement afsluiten</title>
</head>

<body>

<h2>Hallo Hi Abonnementsformulier</h2>

<form>

    <label>Voornaam:</label><br>
    <input type="text" name="voornaam" required><br><br>

    <label>Achternaam:</label><br>
    <input type="text" name="achternaam" required><br><br>

    <label>Aanhef:</label><br>
    <input type="radio" name="aanhef" value="Dhr." checked> Dhr.<br>
    <input type="radio" name="aanhef" value="Mevr."> Mevr.<br>
    <input type="radio" name="aanhef" value="Anders"> Anders<br><br>  

    <label>Straatnaam en huisnummer:</label><br>
    <input type="text" name="adres" required placeholder="Stationsweg 12"><br><br>

    <label>Postcode:</label><br>
    <input type="text" name="postcode" required maxlength="7" placeholder="1234 AB"><br><br>

    <label>Woonplaats:</label><br>
    <input type="text" name="woonplaats" required><br><br>

    <label>Land:</label><br>
    <input type="text" name="land" required><br><br>

    <label>IBAN-nummer:</label><br>
    <input type="text" name="iban" required maxlength="18"
           pattern="NL[0-9]{2}[A-Z]{4}[0-9]{10}"
           placeholder="NL91ABNA0417164300"><br><br>

    <label>Type abonnement:</label><br>
    <select name="abonnement" required>
        <option>Mobiel</option>
        <option>Glasvezel</option>
        <option>TV</option>
    </select><br><br>

    <label>Datum van ingang abonnement:</label><br>
    <input type="date" name="startdatum" required><br><br>

    <label>Looptijd abonnement:</label><br>
    <input type="number" name="looptijd" required min="1" placeholder="12"><br><br>

    <label>Aantal gebruikers:</label><br>
    <input type="number" name="gebruikers" required min="1" max="4"><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>

    <label>Wachtwoord aanmaken:</label><br>
    <input type="password" name="wachtwoord" required><br><br>

    <button type="submit">Sluit abonnement af</button>

</form>

</body>
</html>
